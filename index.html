<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcium Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator" aria-label="Calculator">
      <div class="display">
        <p class="calculation">78 × 9</p>
        <p class="result">0</p>
      </div>
      <div class="buttons">
        <button type="button" id="btn-clear" class="btn-fun" aria-label="Clear">C</button>
        <button type="button" id="btn-invert" class="btn-fun" aria-label="Invert sign">±</button>
        <button type="button" id="btn-percent" class="btn-fun" aria-label="Percent">%</button>
        <button type="button" id="btn-div" class="btn-op" aria-label="Divide">÷</button>
        <button type="button" class="btn-num" aria-label="7">7</button>
        <button type="button" class="btn-num" aria-label="8">8</button>
        <button type="button" class="btn-num" aria-label="9">9</button>
        <button type="button" id="btn-mul" class="btn-op" aria-label="Multiply">×</button>
        <button type="button" class="btn-num" aria-label="4">4</button>
        <button type="button" class="btn-num" aria-label="5">5</button>
        <button type="button" class="btn-num" aria-label="6">6</button>
        <button type="button" id="btn-minus" class="btn-op" aria-label="Subtract">−</button>
        <button type="button" class="btn-num" aria-label="1">1</button>
        <button type="button" class="btn-num" aria-label="2">2</button>
        <button type="button" class="btn-num" aria-label="3">3</button>
        <button type="button" id="btn-plus" class="btn-op" aria-label="Add">+</button>
        <button type="button" id="btn-0" class="btn-num" aria-label="0">0</button>
        <button type="button" id="btn-decimal" class="btn-num" aria-label="Decimal point">.</button>
        <button type="button" id="btn-eq" class="btn-op" aria-label="Equals">=</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
